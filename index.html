<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Garderoben</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F7EFDA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2A0E17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garderoben">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7EFDA; --surface:#FCF8EB; --ink:#4A1423; --head:#7B1431; --muted:#82525B; --line:#DFD0B0;
  --accent:#D90429; --accent-ink:#FFFFFF; --burg:#7B1431; --burg-ink:#F7EFDA;
  --mount:#EDE2C8; --panel:#6B1230; --chalk:#F7EFDA;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2A0E17; --surface:#37131F; --ink:#F6EEDB; --head:#F6EEDB; --muted:#CDAAAD; --line:#5A2937;
    --accent:#FF5468; --accent-ink:#2A0A12; --burg:#8E1B3C;
  }
}
:root[data-theme="dark"]{
  --bg:#2A0E17; --surface:#37131F; --ink:#F6EEDB; --head:#F6EEDB; --muted:#CDAAAD; --line:#5A2937;
  --accent:#FF5468; --accent-ink:#2A0A12; --burg:#8E1B3C;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-tap-highlight-color:transparent}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:720px;margin:0 auto;padding:22px 16px 130px}
h1{font:600 36px/1.05 var(--display);color:var(--head);letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
h2{margin:0}
.grp{font:600 24px/1.15 var(--display);color:var(--head);margin:30px 0 0}
.grp2{font:600 18px/1.2 var(--display);color:var(--head);margin:24px 0 0}
.cnt{font:500 14px var(--body);color:var(--muted);margin-left:8px}
.sheet h3{font:600 18px/1.2 var(--display);color:var(--head);margin:26px 0 0}
.hint .sm{margin-left:6px;vertical-align:baseline}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.lead{color:var(--muted);font-size:14.5px;margin:14px 0 0}
.warn{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:14px;margin:14px 0 0}
.foot{color:var(--muted);font-size:13px;margin-top:34px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap-chips{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px var(--body);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--burg);color:var(--burg-ink);border-color:var(--burg)}
.filters{margin-top:18px}
.filters .chips{padding-bottom:6px}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 20px;font:600 15px var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.sm{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--body);cursor:pointer}
.sm[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sm.danger{color:var(--accent);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;padding:13px 20px 13px 16px;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:15}
.fab[hidden]{display:none}

/* garment grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 12px;margin-top:12px}
.item{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;display:block;width:100%}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.item .nm{display:block;margin-top:8px;font-weight:600;font-size:15px;line-height:1.25}
.meta{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:2px}
.dots{display:inline-flex;align-items:center;gap:3px;flex:none}
.dot.sm{width:8px;height:8px}
.dot.ring{background:conic-gradient(#d90429,#f4a300,#ffe14d,#4cb050,#2a9df4,#8e44ad,#d90429)}
.sw button[disabled]{cursor:not-allowed}
.dot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.28);display:inline-block;flex:none}
.tg{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}

/* photo mounts */
.mount{position:relative;background:var(--mount);aspect-ratio:4/5;display:grid;place-items:center;overflow:hidden;border-radius:6px;width:100%}
.mount img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.mount.ph{text-align:center;padding:8px;font-size:13px;font-weight:600}

.empty{margin-top:40px;padding:28px 4px}
.empty h2{font:600 27px/1.15 var(--display);color:var(--head)}
.empty p{color:var(--muted);max-width:44ch}

/* outfit panel */
.panel{margin-top:6px;border-radius:10px;padding:14px;background-color:var(--panel);
  background-image:repeating-linear-gradient(90deg,rgba(247,239,218,.09) 0 1px,transparent 1px 15px);
}
.pgrid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px}
.pacc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.slot.acc{aspect-ratio:1/.95}
.slot{position:relative;aspect-ratio:1/1.1;border:1.5px dashed rgba(247,239,218,.6);border-radius:6px;background:transparent;color:var(--chalk);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:500 12.5px/1.25 var(--body);text-align:center;padding:6px;cursor:pointer;overflow:hidden}
.slot.tall{grid-row:span 2;aspect-ratio:1/2.2;align-self:stretch;min-height:0}
.slot.coat{grid-row:1/4;aspect-ratio:auto;align-self:stretch;min-height:0}
.slot.filled{border:1.5px solid var(--chalk);padding:0;background:var(--mount);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:0}
.slot.filled .mount{flex:1 1 0;min-height:0;aspect-ratio:auto;border-radius:0;width:100%}
.slot .nm{flex:none;width:100%;padding:5px 8px;background:rgba(70,8,28,.9);color:var(--chalk);font-size:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn.tiny{padding:9px 14px;font-size:14px}
.cfrow{display:flex;gap:6px;margin-top:12px}
.cfrow .cf{flex:1;min-width:0;height:72px;border-radius:10px;border:1px solid rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column;position:relative}
.cfrow .cf b{flex:1;display:block}
.cfrow .cf i{height:14px;display:block}
.cfrow .ringdot{position:absolute;top:5px;right:5px;width:14px;height:14px;border-radius:50%;border:1.5px solid #fff;background:conic-gradient(#d90429,#f4a300,#ffe14d,#4cb050,#2a9df4,#8e44ad,#d90429)}
.cfield{border-radius:12px;overflow:hidden;display:flex;min-height:140px;margin-top:12px;border:1px solid rgba(0,0,0,.2)}
.cfield .cm1{flex:3;display:flex;align-items:flex-end;padding:12px 14px;font-weight:700;font-size:16px}
.cfield .cm2{flex:1;display:flex;align-items:flex-end;padding:10px;font-weight:600;font-size:12px;line-height:1.2}
.gal{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;margin-top:6px}
.gal .pick{flex:none;width:88px}
.swcard{display:flex;flex-direction:column;gap:6px}
.swc{position:relative}
.goodbadge{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.swcard.good .bands{box-shadow:0 0 0 2px var(--accent)}
.chip.mtch{width:100%;text-align:center;padding:6px 8px;font-size:13px}
.chip.mtch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px;margin-top:10px}
.swc{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;display:block;width:100%}
.swc:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.swc .mount{border-radius:10px 10px 0 0}
.swc .bands{display:flex;height:72px;border-radius:0 0 10px 10px;overflow:hidden;border:1px solid rgba(0,0,0,.2);border-top:0}
.swc .bands i{display:block}
.swc .nm2{display:block;margin-top:6px;font-size:13px;font-weight:600;line-height:1.25}
.hint.hv{margin-top:8px}
.hint.bad{color:var(--accent);font-weight:600}

.fld{display:block;margin:16px 0 0}
.fld>span,.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;font:400 16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
textarea{resize:vertical}

.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.ocard{background:none;border:0;padding:0;cursor:pointer;display:block;width:100%;text-align:left;color:inherit}
.ocard:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.collage{display:grid;gap:4px;padding:6px;border-radius:10px;background-color:var(--panel);
  background-image:repeating-linear-gradient(90deg,rgba(247,239,218,.09) 0 1px,transparent 1px 15px)}
.collage .ct{position:relative;aspect-ratio:4/5;background:var(--mount);border-radius:4px;overflow:hidden}
.collage .ct.wide{grid-column:1/-1;aspect-ratio:8/5}
.collage .ct .mount{position:absolute;inset:0;aspect-ratio:auto;border-radius:0}
.collage .ct .ph span{display:none}
.olist{list-style:none;margin:16px 0 0;padding:0}
.orow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sheet .collage{max-width:340px;margin:0 auto}
.ol{list-style:none;margin:12px 0 0;padding:0}
.of{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.strip{display:flex;gap:4px;grid-column:1/-1}
.th{width:46px;flex:none}
.th .mount{border-radius:3px;padding:0}
.th .ph span{display:none}
.oi strong{display:block;font-size:15.5px}
.oa{display:flex;gap:6px}

/* gaps */
.stitch{display:flex;gap:4px;margin:10px 0 6px}
.stitch i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.stitch i.on{background:var(--accent)}
.prog{color:var(--muted);font-size:13px;margin:0}
.occ-h{background:none;border:0;padding:0;font:inherit;color:inherit;display:flex;align-items:center;gap:6px;cursor:pointer;text-align:left}
.chev{display:inline-grid;transition:transform .15s}
.chev.open{transform:rotate(180deg)}
.elrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sg{display:inline-flex;gap:6px;flex:none}
.sgi{width:19px;height:19px;color:var(--line)}
.sgi.on.sommer{color:#F2A31B}
.sgi.on.vinter{color:#63B3E6}
.sgi.on.varhost{color:#58A05A}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tb{background:none;border:0;padding:0;width:56px;cursor:pointer;border-radius:4px;color:inherit}
.tb .mount{border-radius:4px;padding:0}
.tb .ph span{display:none}
.tb.add{aspect-ratio:4/5;border:1.5px dashed var(--muted);color:var(--muted);display:grid;place-items:center}
.el .cnt{margin-left:8px}
.ess-list{list-style:none;margin:8px 0 0;padding:0}
.ess{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.ess svg{margin-top:1px}
.el{font-weight:500}
.el.muted{color:var(--muted)}
.strike{text-decoration:line-through}
.ra{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ef{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted)}
.ef .mount{width:34px;border-radius:3px;padding:0}
.ef .ph span{display:none}
.wl{list-style:none;margin:10px 0 0;padding:0}
.wl li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;border-radius:50%;display:grid;place-items:center}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11.5px var(--body);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(36,6,14,.55);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));z-index:31;outline:none}
.sheet.enter{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h2{font:600 24px/1.15 var(--display);color:var(--head)}
.photo{width:100%;max-width:240px;margin:16px auto 0;display:block}
.photo-empty{aspect-ratio:4/5;border:1.5px dashed var(--muted);border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;padding:18px;font-size:14px}
.photo-empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.tip{color:var(--muted);font-size:13px;text-align:center;margin:8px auto 0;max-width:34ch}
.swap{display:block;margin:10px auto 0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rng{display:block;margin-top:14px}
.rng span{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent)}
.photo .mount.tapmode{outline:3px solid var(--accent);outline-offset:2px}
.photo img.tapping{cursor:crosshair}
.photo img.painting{cursor:crosshair;touch-action:none}
.photo .paintcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,0,0,.28);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sw .other{background:repeating-linear-gradient(45deg,#b4b6ba 0 5px,#e3e4e6 5px 10px)}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin-top:16px}
.pick{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.pick .mount{border:2px solid transparent}
.pick[aria-pressed="true"] .mount{border-color:var(--accent)}
.pick .pn{display:block;margin-top:5px;font-size:13px;font-weight:500;line-height:1.25}

/* printing: the week plan only, without controls */
@media print{
  html,body{background:#fff!important;color:#000!important}
  :root{padding:0}
  .tabs,.fab,#warn,header .sub,.chips,.row,.addrow,.sm,.x,.hint,.backup,#toast,.weekbar .x{display:none!important}
  .wrap{max-width:none;padding:0 8mm}
  h1{font-size:24px;color:#000}
  .wk b{color:#000}
  .day{break-inside:avoid;border-top:1px solid #888;margin-top:6px;padding:8px 0}
  .dayh h3,.dayh h3 span,.day.today .dayh h3{color:#000!important}
  .dayo{overflow:visible;flex-wrap:wrap;padding:6px 0 0}
  .dayc{width:30mm}
  .daynote{border:0!important;background:none!important;padding:2px 0!important;color:#000!important;font-size:12px}
  .daynote:placeholder-shown{display:none}
  .collage,.collage .ct,.mount{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* planning */
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.wk{text-align:center;display:flex;flex-direction:column}
.wk b{font:600 22px/1.15 var(--display);color:var(--head)}
.wk span{color:var(--muted);font-size:13px}
.day{border-top:1px solid var(--line);padding:14px 0 12px;margin-top:12px}
.dayh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dayh h3{margin:0;font:600 18px/1.2 var(--display);color:var(--head)}
.dayh h3 span{font:500 14px var(--body);color:var(--muted);margin-left:8px}
.day.today .dayh h3{color:var(--accent)}
.day.today .dayh h3 span{color:var(--accent)}
.dayo{display:flex;gap:12px;overflow-x:auto;padding:12px 6px 6px 0}
.dayc{position:relative;flex:none;width:132px}
.dayc .rm{position:absolute;top:-8px;right:-8px;background:var(--surface);border:1px solid var(--line);width:28px;height:28px;padding:0}
.daynote{margin-top:10px;font-size:15px}
.oname{display:block;margin-top:4px;font-size:13px;font-weight:600;line-height:1.25}
.packs{display:grid;gap:10px;margin-top:14px}
.packc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:inherit;font:inherit;cursor:pointer;display:grid;gap:4px}
.packc b{font-size:16px}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar.big{height:8px;margin-top:14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ph{font:600 17px/1.2 var(--display);color:var(--head);margin:22px 0 0}
.plist{list-style:none;margin:6px 0 0;padding:0}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow .th{width:42px}
.prow .pt{flex:1;min-width:0}
.prow.done .pt{opacity:.55;text-decoration:line-through}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--muted);background:none;flex:none;display:grid;place-items:center;color:var(--accent-ink);cursor:pointer;padding:0}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}

/* backup */
.backup{margin-top:36px;padding-top:4px;border-top:1px solid var(--line)}
.backup .hint{margin:8px 0 0}

/* palette */
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 12px;margin-top:18px}
.chipc{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;display:block;width:100%}
.chipc:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.chipc .cc{display:block;aspect-ratio:1/1.15;border-radius:6px;border:1px solid rgba(0,0,0,.22)}
.chipc .cn{display:block;margin-top:7px;font-weight:600;font-size:14.5px;line-height:1.25}
.chipc .cm{display:block;color:var(--muted);font-size:12.5px}

<script>
(function(){
'use strict';

/* ---------- data ---------- */
var CATS=[
  {k:'yttertoy',l:'Yttertøy'},{k:'blazer',l:'Dressjakke'},{k:'skjorte',l:'Bluse / skjorte'},
  {k:'topp',l:'Topp / t-skjorte'},{k:'genser',l:'Genser'},{k:'bukse',l:'Bukse'},

];
var OCCS=[{k:'formelt',l:'Formelt'},{k:'hoytidelig',l:'Høytidelig'},{k:'hverdag',l:'Hverdag'},{k:'fest',l:'Fest'},{k:'fritid',l:'Fritid og trening'}];
var DEFAULT_COLORS=[
  {k:'svart',l:'Svart',hex:'#1b1c1f',g:'svart'},
  {k:'hvit',l:'Hvit',hex:'#f7f7f4',g:'hvit'},
  {k:'himmelblaa',l:'Himmelblå',hex:'#87ceeb',g:'bla'}
];
var SEASONS=[{k:'helars',l:'Helårs'},{k:'sommer',l:'Sommer'},{k:'vinter',l:'Vinter'},{k:'varhost',l:'Vår/høst'}];
var GROUPS=[
  {k:'hvit',l:'Hvit og krem'},{k:'gul',l:'Gul'},{k:'oransje',l:'Oransje'},{k:'rod',l:'Rød og burgunder'},
  {k:'rosa',l:'Rosa'},{k:'lilla',l:'Lilla'},{k:'bla',l:'Blå'},{k:'gronn',l:'Grønn'},
  {k:'brun',l:'Brun og beige'},{k:'gra',l:'Grå'},{k:'svart',l:'Svart'}
];
function hsl(hex){
  var h6=normHex(hex)||'#888888',r=parseInt(h6.substr(1,2),16)/255,g=parseInt(h6.substr(3,2),16)/255,b=parseInt(h6.substr(5,2),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn,s=d===0?0:d/(1-Math.abs(2*l-1)),h=0;
  if(d!==0){
    if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;
    h=h*60;if(h<0)h+=360;
  }
  return {h:h,s:s,l:l};
}
function groupOf(hex){
  var c=hsl(hex),h=c.h,s=c.s,l=c.l;
  if(l<=0.13)return 'svart';
  if(s<0.12)return l>=0.88?'hvit':'gra';
  if(l>=0.84&&h>=25&&h<=70)return 'hvit';
  if(h<15||h>=345)return l>=0.72?'rosa':'rod';
  if(h<45)return (l<0.42||s<0.35)?'brun':'oransje';
  if(h<70)return (l<0.38||s<0.35)?'brun':'gul';
  if(h<165)return 'gronn';
  if(h<255)return 'bla';
  if(h<320)return 'lilla';
  return 'rosa';
}
function cg(c){return c.g||groupOf(c.hex)}
function gIndex(k){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].k===k)return i;return GROUPS.length}
function sortedColors(){
  return S.colors.slice().sort(function(a,b){
    return gIndex(cg(a))-gIndex(cg(b))||hsl(b.hex).l-hsl(a.hex).l||String(a.l).localeCompare(String(b.l),'nb');
  });
}
var SLOTS=[
  {k:'yttertoy',l:'Yttertøy',cats:['yttertoy'],coat:true},
  {k:'jakke',l:'Dressjakke',cats:['blazer']},
  {k:'overdel',l:'Bluse, genser eller topp',cats:['skjorte','genser','topp']},
  {k:'underdel',l:'Bukse, skjørt, kjole eller badetøy',cats:['bukse','skjoert','kjole','badetoy'],tall:true},
  {k:'sko',l:'Sko',cats:['sko'],tall:true},
  {k:'smykker',l:'Smykker',cats:['smykker'],acc:true},
  {k:'veske',l:'Veske',cats:['vesker'],acc:true},
  {k:'tilbehor',l:'Tilbehør',cats:['tilbehor'],acc:true}
];
/* rows shown under every occasion on the Mangler tab, in this order */
var MEXCL={hverdag:['blazer'],fest:['blazer'],fritid:['blazer','smykker','skjoert','kjole','skjorte']}; /* rows left out unless they already hold garments */
var MROWS=[
  {k:'yttertoy',cats:['yttertoy']},{k:'blazer',cats:['blazer']},{k:'skjorte',cats:['skjorte']},
  {k:'topp',cats:['topp']},{k:'genser',cats:['genser']},{k:'bukse',cats:['bukse']},
  {k:'skjoert',cats:['skjoert']},{k:'kjole',cats:['kjole']},{k:'badetoy',cats:['badetoy'],only:['hverdag','fritid']},{k:'sko',cats:['sko']},
  {k:'smykker',cats:['smykker']},{k:'vesker',cats:['vesker']},{k:'tilbehor',cats:['tilbehor']}
];

var S={tab:'plagg',items:[],outfits:[],wish:[],colors:[],fOcc:'alle',fCat:'alle',fSeason:'alle',fGroup:'alle',fExtra:false,oSeason:'alle',oGroup:'alle',occ:'formelt',
  cur:{},curName:'',curId:null,storage:true,sheet:null,edit:null,picker:null,confirmDel:false,confirmOutfit:null,customText:'',
  cdraft:null,colorFrom:null,editScroll:0,lastBackup:'',importData:null,mClosed:{hoytidelig:true,hverdag:true,fest:true,fritid:true},mSeason:'alle',plans:{},packs:[],projects:[],anchor:null,projOpen:null,projName:'',anCat:'alle',fUse:'alle',fSort:'navn',fFlat:false,projGood:false,shareText:'',planMode:'uke',weekMon:dstr(monOf(new Date())),planPickDay:0,ppOcc:'alle',pcCat:'alle',packOpen:null,packName:'',packText:'',confirmWeek:false,antMode:'bygg',outfitOcc:'alle',outfitView:null};

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function catL(k){var c=CATS.filter(function(x){return x.k===k})[0];return c?c.l:''}
function seasonMatch(i,sel){
  if(sel==='alle')return true;
  var se=i.seasons||[];
  return sel==='helars'?se.indexOf('helars')>-1:(se.indexOf(sel)>-1||se.indexOf('helars')>-1);
}
var PATTERNS=[{k:'ensfarget',l:'Ensfarget'},{k:'striper',l:'Striper'},{k:'rutete',l:'Rutete'},{k:'blomster',l:'Blomster'},{k:'flerfarget',l:'Flerfarget mønster'},{k:'annet',l:'Annet mønster'}];
function patternL(k){var p=PATTERNS.filter(function(x){return x.k===k})[0];return p?p.l:''}
function groupL(k){if(k==='multi')return 'Flerfarget';var g=GROUPS.filter(function(x){return x.k===k})[0];return g?g.l:''}
function colorGroupOf(i){var c=S.colors.filter(function(x){return x.k===i.color})[0];return c?cg(c):''}
function groupMatch(i,sel){
  if(sel==='alle')return true;
  if(sel==='multi')return i.pattern==='flerfarget';
  if(colorGroupOf(i)===sel)return true;
  if(S.fExtra)return (i.colors2||[]).some(function(k){var c=S.colors.filter(function(x){return x.k===k})[0];return !!c&&cg(c)===sel});
  return false;
}
function outfitFilterOk(i){return seasonMatch(i,S.oSeason)&&groupMatch(i,S.oGroup)}
function groupsPresent(){return GROUPS.filter(function(g){return S.colors.some(function(c){return cg(c)===g.k})})}
function groupChoices(){return groupsPresent().concat([{k:'multi',l:'Flerfarget'}])}
function extraToggle(sel){
  return (sel!=='alle'&&sel!=='multi')?'<div class="chips"><button class="chip" data-act="fExtra" aria-pressed="'+!!S.fExtra+'">Ta med tilleggsfarger</button></div>':'';
}
function colorDots(i){
  var c=colObj(i.color),out='';
  if(!c.none)out+='<i class="dot" style="background:'+esc(c.hex)+'" title="'+esc(c.l)+'"></i>';
  (i.colors2||[]).forEach(function(k){var x=colObj(k);if(!x.none)out+='<i class="dot sm" style="background:'+esc(x.hex)+'" title="'+esc(x.l)+'"></i>'});
  if(i.pattern==='flerfarget')out+='<i class="dot ring" title="Flerfarget mønster"></i>';
  return out?'<span class="dots">'+out+'</span>':'';
}
var LETTER_SIZES={xxxs:-3,xxs:-2,xs:-1,s:0,m:1,l:2,xl:3,xxl:4,'2xl':4,xxxl:5,'3xl':5,xxxxl:6,'4xl':6,'5xl':7};
function sizeSort(sz){
  var t=String(sz||'').trim().toLowerCase();
  if(!t)return [9,0,''];
  var tok=t.split(/[\s\/,\-–]+/)[0].replace(',','.');
  if(/^\d+(\.\d+)?$/.test(tok))return [0,parseFloat(tok),t];
  if(LETTER_SIZES.hasOwnProperty(tok))return [1,LETTER_SIZES[tok],t];
  var n=tok.match(/^\d+(\.\d+)?/);
  if(n)return [0,parseFloat(n[0]),t];
  return [2,0,t];
}
function byNameCmp(a,b){return String(a.name).localeCompare(String(b.name),'nb')}
function colorRank(i){
  var c=S.colors.filter(function(x){return x.k===i.color})[0];
  if(!c)return [99,0];
  return [gIndex(cg(c)),-hsl(c.hex).l];
}
function sortItems(arr,mode){
  if(mode==='navn')return arr.sort(byNameCmp);
  if(mode==='farge')return arr.sort(function(a,b){
    var x=colorRank(a),y=colorRank(b);
    return x[0]-y[0]||x[1]-y[1]||byNameCmp(a,b);
  });
  var desc=(mode==='strned');
  return arr.sort(function(a,b){
    var x=sizeSort(a.size),y=sizeSort(b.size);
    if(x[0]===9||y[0]===9){if(x[0]!==y[0])return x[0]===9?1:-1;return byNameCmp(a,b)}
    var c=x[0]-y[0]||x[1]-y[1]||x[2].localeCompare(y[2],'nb');
    if(desc)c=-c;
    return c||byNameCmp(a,b);
  });
}
function sortChips(){
  var opts=[{k:'navn',l:'Navn'},{k:'farge',l:'Farge'},{k:'str',l:'Størrelse, minst først'},{k:'strned',l:'Størrelse, størst først'}];
  return '<span class="lbl" style="margin-bottom:6px">Sortering</span><div class="chips">'+opts.map(function(o){
    return '<button class="chip" data-act="fSort" data-v="'+o.k+'" aria-pressed="'+(S.fSort===o.k)+'">'+o.l+'</button>';
  }).join('')+'<button class="chip" data-act="fFlat" aria-pressed="'+S.fFlat+'">Ikke grupper etter type</button></div>';
}
function usedSizes(){
  var seen={},out=[];
  S.items.forEach(function(i){var z=String(i.size||'').trim();if(z&&!seen[z]){seen[z]=1;out.push(z)}});
  return out.sort(function(a,b){var x=sizeSort(a),y=sizeSort(b);return x[0]-y[0]||x[1]-y[1]||x[2].localeCompare(y[2],'nb')});
}
function curYear(){return new Date().getFullYear()}
function lastUsedYear(i){return (i.usedYears||[]).slice().sort(function(a,b){return b-a})[0]}
function usedLineFor(i){var y=lastUsedYear(i);return y?'Sist brukt i '+y:'Sist brukt: ukjent dato'}
function useMatch(i,sel){
  if(sel==='alle')return true;
  var on=(i.usedYears||[]).indexOf(curYear())>-1;
  return sel==='ja'?on:!on;
}
function seasonL(k){var o=SEASONS.filter(function(x){return x.k===k})[0];return o?o.l:''}
function occL(k){var o=OCCS.filter(function(x){return x.k===k})[0];return o?o.l:''}
function colObj(k){return S.colors.filter(function(x){return x.k===k})[0]||{k:'',l:'Ingen farge',hex:'#c9ccd2',none:true}}
function normHex(v){v=String(v||'').trim();if(v[0]!=='#')v='#'+v;if(/^#[0-9a-f]{3}$/i.test(v))v='#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];return /^#[0-9a-f]{6}$/i.test(v)?v.toLowerCase():null}
function isDark(hex){var h=normHex(hex)||'#ffffff',r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);return (0.299*r+0.587*g+0.114*b)<140}
function byId(id){return S.items.filter(function(i){return i.id===id})[0]}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on')},2400)}

var PLUS='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
var CHECK='<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--accent)"/><path d="m7.5 12.5 3 3 6-6.5" fill="none" stroke="var(--accent-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var OPEN='<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/></svg>';
var CLOSE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

function mount(i){
  if(i.img) return '<div class="mount"><img src="'+i.img+'" alt="'+esc(i.name)+'"></div>';
  var c=colObj(i.color);
  return '<div class="mount ph" style="background:'+c.hex+';color:'+(isDark(c.hex)?'#f3f3f0':'#1c2533')+'"><span>'+esc(catL(i.cat))+'</span></div>';
}

/* ---------- storage (IndexedDB) ---------- */
var db=null;
function openDB(){
  return new Promise(function(res){
    try{
      var r=indexedDB.open('formell-garderobe',4);
      r.onupgradeneeded=function(){var d=r.result;['items','outfits','wish','meta','plans','packs','projects'].forEach(function(n){if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
      r.onsuccess=function(){db=r.result;res(true)};
      r.onerror=function(){res(false)};
      r.onblocked=function(){res(false)};
      setTimeout(function(){res(false)},4000);
    }catch(e){res(false)}
  });
}
function tx(store,mode,fn){
  return new Promise(function(res,rej){
    try{
      var t=db.transaction(store,mode),rq=fn(t.objectStore(store));
      t.oncomplete=function(){res(rq&&rq.result)};
      t.onerror=function(){rej(t.error)};
      t.onabort=function(){rej(t.error)};
    }catch(e){rej(e)}
  });
}
function dbAll(s){return tx(s,'readonly',function(st){return st.getAll()})}
function dbPut(s,o){return tx(s,'readwrite',function(st){return st.put(o)})}
function dbDel(s,id){return tx(s,'readwrite',function(st){return st.delete(id)})}
function dbPutMany(s,arr){return tx(s,'readwrite',function(st){arr.forEach(function(o){st.put(o)})})}
function dbClear(s){return tx(s,'readwrite',function(st){return st.clear()})}
async function save(store,obj){
  if(!db) return true;
  try{await dbPut(store,obj);return true}
  catch(e){toast('Kunne ikke lagre. Det kan være for lite plass på enheten.');return false}
}
async function del(store,id){ if(!db) return; try{await dbDel(store,id)}catch(e){} }
function savePalette(){return save('meta',{id:'palette',colors:S.colors})}

var OLD_OCC={forretning:'formelt',selskap:'hoytidelig',blacktie:'hoytidelig'};
function mapOcc(list){var out=[];(list||[]).forEach(function(t){var n=OLD_OCC[t]||t;if(out.indexOf(n)<0)out.push(n)});return out}
async function migrate(meta,allMeta){
  if(meta&&meta.colors){S.colors=meta.colors}
  else{S.colors=DEFAULT_COLORS.map(function(c){return Object.assign({},c)});await savePalette()}
  var gch=false;
  S.colors.forEach(function(c){if(!c.g){c.g=groupOf(c.hex);gch=true}});
  if(gch)await savePalette();
  if(!(allMeta||[]).some(function(m){return m.id==='added:isager54'})){
    if(!S.colors.some(function(c){return c.k==='isager54'})){
      S.colors.push({k:'isager54',l:'Petrol (Isager Alpaca 1, nr. 54)',hex:'#526069',g:'bla'});
      await savePalette();
    }
    await save('meta',{id:'added:isager54'});
  }
  var keys=S.colors.map(function(c){return c.k});
  for(var i=0;i<S.items.length;i++){
    var it=S.items[i],ch=false,tags=mapOcc(it.tags);
    if(it.cat==='smoking'||it.cat==='dress'){it.cat='blazer';ch=true}
    if(it.cat==='slips'||it.cat==='belte'){it.cat='tilbehor';ch=true}
    if(tags.join()!==(it.tags||[]).join()){it.tags=tags;ch=true}
    var col=it.color==='lyseblaa'?'himmelblaa':(it.color||'');
    if(col&&keys.indexOf(col)<0)col='';
    if(col!==it.color){it.color=col;ch=true}
    var c2k=(it.colors2||[]).filter(function(k){return keys.indexOf(k)>-1});
    if(c2k.length!==(it.colors2||[]).length){it.colors2=c2k;ch=true}
    var gk=(it.goodColors||[]).filter(function(k){return keys.indexOf(k)>-1});
    if(gk.length!==(it.goodColors||[]).length){it.goodColors=gk;ch=true}
    if(ch)await save('items',it);
  }
  for(var j=0;j<S.outfits.length;j++){
    var o=S.outfits[j],no=OLD_OCC[o.occ]||o.occ;
    if(no!==o.occ){o.occ=no;await save('outfits',o)}

function fileToDataURL(file,max){
  max=max||800;
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('read'))};
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){
        var sc=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
        var x=c.getContext('2d');x.fillStyle='#ede2c8';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.9));
      };
      im.onerror=function(){rej(new Error('img'))};
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* cream background: only the background connected to the photo's edge is replaced */
function cleanBg(d,w,h,tol,opts){
  opts=opts||{};
  var rs=[],gs=[],bs=[],X,Y;
  function add(i){rs.push(d[i]);gs.push(d[i+1]);bs.push(d[i+2])}
  for(X=0;X<w;X++){add(X*4);add(((h-1)*w+X)*4)}
  for(Y=0;Y<h;Y++){add(Y*w*4);add((Y*w+w-1)*4)}
  function med(a){a.sort(function(p,q){return p-q});return a[a.length>>1]}
  var br=med(rs),bg=med(gs),bb=med(bs),t2=tol*tol;
  function dist2(i){var dr=d[i]-br,dg=d[i+1]-bg,db=d[i+2]-bb;return dr*dr+dg*dg+db*db}
  var N=w*h,mask=new Uint8Array(N),stack=new Int32Array(N),sp=0,count=0;
  function push(p){if(!mask[p]&&dist2(p*4)<=t2){mask[p]=1;stack[sp++]=p;count++}}
  for(X=0;X<w;X++){push(X);push((h-1)*w+X)}
  for(Y=0;Y<h;Y++){push(Y*w);push(Y*w+w-1)}
  while(sp){
    var p=stack[--sp],px=p%w,py=(p-px)/w;
    if(px>0)push(p-1);if(px<w-1)push(p+1);if(py>0)push(p-w);if(py<h-1)push(p+w);
  }
  var coverage=count/N;
  if(coverage<0.02)return coverage;

  /* closed areas of background (for example between straps) */
  if(opts.holes){
    var minArea=Math.max(250,Math.round(N*0.0006)),seen=new Uint8Array(N),comp=new Int32Array(N);
    for(var s0=0;s0<N;s0++){
      if(mask[s0]||seen[s0]||dist2(s0*4)>t2)continue;
      var cn=0,cp=0;comp[cn++]=s0;seen[s0]=1;
      while(cp<cn){
        var c0=comp[cp++],cx=c0%w,cy=(c0-cx)/w,nb=[];
        if(cx>0)nb.push(c0-1);if(cx<w-1)nb.push(c0+1);if(cy>0)nb.push(c0-w);if(cy<h-1)nb.push(c0+w);
        for(var k=0;k<nb.length;k++){var n=nb[k];if(!mask[n]&&!seen[n]&&dist2(n*4)<=t2){seen[n]=1;comp[cn++]=n}}
      }
      if(cn>=minArea){for(var z=0;z<cn;z++)mask[comp[z]]=1;count+=cn}
    }
  }

  /* areas the user tapped: filled regardless of size, matched to the colour that was tapped */
  (opts.seeds||[]).forEach(function(sd){
    var sx=Math.max(0,Math.min(w-1,Math.round(sd[0]*(w-1)))),sy=Math.max(0,Math.min(h-1,Math.round(sd[1]*(h-1))));
    var p0=sy*w+sx;if(mask[p0])return;
    var r0=d[p0*4],g0=d[p0*4+1],b0=d[p0*4+2],seen2=new Uint8Array(N),st=[p0];seen2[p0]=1;
    while(st.length){
      var q=st.pop();mask[q]=1;count++;
      var qx=q%w,qy=(q-qx)/w,nb2=[];
      if(qx>0)nb2.push(q-1);if(qx<w-1)nb2.push(q+1);if(qy>0)nb2.push(q-w);if(qy<h-1)nb2.push(q+w);
      for(var j=0;j<nb2.length;j++){
        var m=nb2[j];if(mask[m]||seen2[m])continue;
        var dr=d[m*4]-r0,dg=d[m*4+1]-g0,db=d[m*4+2]-b0;
        if(dr*dr+dg*dg+db*db<=t2){seen2[m]=1;st.push(m)}
      }
    }
  });
  coverage=count/N;

  var CR=237,CG=226,CB=200,edge=[];
  for(var q2=0;q2<N;q2++){
    if(mask[q2])continue;
    var qx2=q2%w,qy2=(q2-qx2)/w;
    if((qx2>0&&mask[q2-1])||(qx2<w-1&&mask[q2+1])||(qy2>0&&mask[q2-w])||(qy2<h-1&&mask[q2+w]))edge.push(q2);
  }
  for(var e=0;e<edge.length;e++){
    var i=edge[e]*4,dist=Math.sqrt(dist2(i)),a=Math.max(0,Math.min(1,(dist-tol)/tol));
    d[i]=Math.round(CR*(1-a)+d[i]*a);d[i+1]=Math.round(CG*(1-a)+d[i+1]*a);d[i+2]=Math.round(CB*(1-a)+d[i+2]*a);
  }
  for(var m2=0;m2<N;m2++){if(mask[m2]){var kk=m2*4;d[kk]=CR;d[kk+1]=CG;d[kk+2]=CB}}
  return coverage;
}
/* hand-drawn strokes in cream, stored as normalised points so they can always be undone */
function drawStrokes(x,w,h,strokes){
  x.fillStyle='#ede2c8';x.strokeStyle='#ede2c8';x.lineCap='round';x.lineJoin='round';
  strokes.forEach(function(st){
    var R=st.r*w;
    if(!st.pts||!st.pts.length)return;
    if(st.pts.length===1){x.beginPath();x.arc(st.pts[0][0]*w,st.pts[0][1]*h,R,0,Math.PI*2);x.fill();return}
    x.lineWidth=2*R;x.beginPath();x.moveTo(st.pts[0][0]*w,st.pts[0][1]*h);
    for(var i=1;i<st.pts.length;i++)x.lineTo(st.pts[i][0]*w,st.pts[i][1]*h);
    x.stroke();
  });
}
function composeImage(dataUrl,o){
  return new Promise(function(res,rej){
    var im=new Image();
    im.onerror=function(){rej(new Error('img'))};
    im.onload=function(){
      var w=im.width,h=im.height,c=document.createElement('canvas');
      c.width=w;c.height=h;
      var x=c.getContext('2d');x.drawImage(im,0,0);
      var status='ok',strokes=o.strokes||[];
      if(o.cream){
        var id=x.getImageData(0,0,w,h),cov=cleanBg(id.data,w,h,o.tol,{holes:o.holes,seeds:o.seeds});
        if(cov<0.02)status='none';else if(cov>0.93)status='toomuch';else x.putImageData(id,0,0);
      }
      drawStrokes(x,w,h,strokes);
      var untouched=(status!=='ok'&&!strokes.length);
      res({url:untouched?dataUrl:c.toDataURL('image/jpeg',0.92),status:status});
    };
    im.src=dataUrl;
  });
}
var bgToken=0,bgTimer=null;
async function reprocessImg(){
  var e=S.edit;if(!e||!e.imgOrig)return;
  var my=++bgToken,strokes=e.strokes||[];
  try{
    var r;
    if(e.bg!=='krem'&&!strokes.length)r={url:e.imgOrig,status:'ok'};
    else r=await composeImage(e.imgOrig,{cream:e.bg==='krem',tol:e.tol,holes:e.holes!==false,seeds:e.seeds||[],strokes:strokes});
    if(my!==bgToken||S.edit!==e)return;
    e.img=r.url;var im=document.querySelector('.photo .mount img');if(im)im.src=r.url;
  }catch(err){}

/* ---------- sharing and printing ---------- */
var NL=String.fromCharCode(10);
function slugify(t){return String(t||'').toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'a').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'garderoben'}
function isTouch(){return !!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)}
async function deliverFile(name,blob,title){
  if(window.claude&&typeof window.claude.use==='function'){
    var dl=await window.claude.use('downloads');
    if(dl){await dl.save({filename:name,data:blob});return 'saved'}
  }
  var file=null;
  try{file=new File([blob],name,{type:blob.type})}catch(e){}
  if(isTouch()&&file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
    try{await navigator.share({files:[file],title:title});return 'shared'}
    catch(e){if(e&&e.name==='AbortError')return 'cancel'}
  }
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove()},4000);
  return 'saved';
}
async function shareText(title,text){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      var dl=await window.claude.use('downloads');
      if(dl){await dl.save({filename:slugify(title)+'.txt',data:text});toast('Listen er lagret');return}
    }
    if(isTouch()&&navigator.share){await navigator.share({title:title,text:text});return}
    if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);toast('Listen er kopiert');return}
  }catch(e){
    if(e&&(e.name==='AbortError'||e.code==='declined'))return;
  }
  S.shareText=text;S.sheet='sharetext';renderSheet(false);
}

function loadImg(src){return new Promise(function(res){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){res(null)};im.src=src})}
function rrect(x,px,py,w,h,r){
  x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();
}
async function outfitBlob(o){
  var its=SLOTS.map(function(s){return byId(o.slots[s.k])}).filter(Boolean),n=its.length;
  if(!n)return null;
  var cols=n===1?1:(n<=4?2:3),rows=Math.ceil(n/cols);
  var W=1080,pad=40,gap=16,headH=206,footH=84;
  var cw=Math.floor((W-2*pad-(cols-1)*gap)/cols),ch=Math.round(cw*1.25);
  var H=headH+rows*ch+(rows-1)*gap+footH;
  var c=document.createElement('canvas');c.width=W;c.height=H;
  var x=c.getContext('2d');
  try{await document.fonts.load('600 64px Fraunces');await document.fonts.load('500 30px Nunito')}catch(e){}
  x.fillStyle='#6B1230';x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(247,239,218,0.09)';x.lineWidth=2;
  for(var px=0;px<W;px+=30){x.beginPath();x.moveTo(px+0.5,0);x.lineTo(px+0.5,H);x.stroke()}
  x.fillStyle='#F7EFDA';x.textBaseline='alphabetic';
  var size=68;x.font='600 '+size+'px Fraunces, Georgia, serif';
  while(x.measureText(o.name).width>W-2*pad&&size>30){size-=4;x.font='600 '+size+'px Fraunces, Georgia, serif'}
  x.fillText(o.name,pad,pad+78);
  x.font='500 30px Nunito, system-ui, sans-serif';x.fillStyle='rgba(247,239,218,0.82)';
  x.fillText(occL(o.occ),pad,pad+128);
  var imgs=await Promise.all(its.map(function(i){return i.img?loadImg(i.img):Promise.resolve(null)}));
  for(var k=0;k<n;k++){
    var row=Math.floor(k/cols),col=k%cols,inRow=Math.min(cols,n-row*cols);
    var offset=(cols-inRow)*(cw+gap)/2;
    var tx=pad+offset+col*(cw+gap),ty=headH+row*(ch+gap);
    x.save();rrect(x,tx,ty,cw,ch,18);x.clip();
    x.fillStyle='#EDE2C8';x.fillRect(tx,ty,cw,ch);
    var im=imgs[k];
    if(im){
      var sc=Math.min(cw/im.width,ch/im.height),dw=im.width*sc,dh=im.height*sc;
      x.drawImage(im,tx+(cw-dw)/2,ty+(ch-dh)/2,dw,dh);
    }else{
      var col0=colObj(its[k].color);
      x.fillStyle=col0.hex;x.fillRect(tx,ty,cw,ch);
      x.fillStyle=isDark(col0.hex)?'#F3F3F0':'#1C2533';x.font='600 30px Nunito, system-ui, sans-serif';x.textAlign='center';
      x.fillText(catL(its[k].cat),tx+cw/2,ty+ch/2);x.textAlign='left';
    }
    x.restore();
  }
  x.fillStyle='rgba(247,239,218,0.75)';x.font='500 28px Nunito, system-ui, sans-serif';
  x.fillText('Garderoben',pad,H-34);
  return new Promise(function(res){c.toBlob(res,'image/png')});
}

function fillRest(){
  var cur=S.cur,occ=S.occ;
  function pool(cats){
    return S.items.filter(function(i){return cats.indexOf(i.cat)>-1&&i.tags.indexOf(occ)>-1&&outfitFilterOk(i)});
  }
  function rnd(a){return a[Math.floor(Math.random()*a.length)]}
  function pick(slot,cats){
    if(byId(cur[slot]))return null;
    var p=pool(cats);
    if(!p.length)return null;
    var it=rnd(p);cur[slot]=it.id;return it;
  }
  var noShirt=false,bottom=byId(cur.underdel);
  if(bottom){noShirt=(bottom.cat==='kjole')}
  else{
    var it=pick('underdel',byId(cur.overdel)?['bukse','skjoert']:['bukse','skjoert','kjole']);
    if(it&&it.cat==='kjole')noShirt=true;
  }
  if(!noShirt)pick('overdel',['skjorte','genser','topp']);
  pick('jakke',['blazer']);
  pick('yttertoy',['yttertoy']);
  pick('sko',['sko']);
  pick('smykker',['smykker']);
  pick('veske',['vesker']);
  pick('tilbehor',['tilbehor']);
}

  return order.map(function(k){return m[k]});
}

function suggest(){
  var out={},occ=S.occ;
  function pool(cats){return S.items.filter(function(i){return cats.indexOf(i.cat)>-1&&i.tags.indexOf(occ)>-1&&outfitFilterOk(i)})}
  function rnd(a){return a[Math.floor(Math.random()*a.length)]}
  var anyTagged=S.items.some(function(i){return i.tags.indexOf(occ)>-1&&outfitFilterOk(i)});
  if(!anyTagged){toast((S.oSeason!=='alle'||S.oGroup!=='alle')?'Ingen plagg for «'+occL(occ)+'» passer med sesongen og fargegruppen du har valgt':'Ingen plagg er merket «'+occL(occ)+'» ennå');return}
  var p;
  if((p=pool(['yttertoy'])).length) out.yttertoy=rnd(p).id;
  var j=pool(['blazer']);
  var jacket=j.length?rnd(j):null;
  if(jacket){
    out.jakke=jacket.id;
  }
  var noShirt=false;
  if(!out.underdel){
    var u=pool(['bukse','skjoert','kjole']);
    if(u.length){var pick=rnd(u);out.underdel=pick.id;if(pick.cat==='kjole')noShirt=true}
  }
  if(!noShirt){
    if((p=pool(['skjorte','genser','topp'])).length) out.overdel=rnd(p).id;
  }
  if((p=pool(['sko'])).length) out.sko=rnd(p).id;
  if((p=pool(['smykker'])).length) out.smykker=rnd(p).id;
  if((p=pool(['vesker'])).length) out.veske=rnd(p).id;
  if((p=pool(['tilbehor'])).length) out.tilbehor=rnd(p).id;
  S.cur=out;S.curId=null;render();
}

        var dl=await window.claude.use('downloads');

        await markBackup();return;
      }
      var url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
      var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(url);a.remove()},4000);
      await markBackup();

  photoTap:function(d,ev){
    var e=S.edit;if(!e||!e.tapMode||!ev)return;
    var im=ev.target,r=im.getBoundingClientRect(),nw=im.naturalWidth,nh=im.naturalHeight;
    if(!nw||!nh||!r.width)return;
    var sc=Math.min(r.width/nw,r.height/nh),dw=nw*sc,dh=nh*sc,ox=r.left+(r.width-dw)/2,oy=r.top+(r.height-dh)/2;

  },
  bgSet:async function(d){

    dd.note=e.target.value;saveSoon('plan',function(){savePlan(pl)});return;
  }
  if(f==='packname'){S.packName=e.target.value;return}
  if(f==='packtext'){S.packText=e.target.value;return}
  if(f==='packtitle'){
    var pk=packById(S.packOpen);
    if(pk){pk.name=e.target.value;saveSoon('pack',function(){savePack(pk)})}
    return;
  }
  if(f==='tol'&&S.edit){S.edit.tol=+e.target.value;scheduleBg();return}
  if(f==='brush'&&S.edit){S.edit.brush=+e.target.value;return}
  if(f==='cname'&&S.cdraft){S.cdraft.name=e.target.value;return}
  if(f==='chex'&&S.cdraft){setHex(e.target.value.toLowerCase(),'chext');return}
  if(f==='chext'&&S.cdraft){var hx=normHex(e.target.value);if(hx)setHex(hx,'chex');return}
  if(f==='cgrp'&&S.cdraft){S.cdraft.g=e.target.value;S.cdraft.gManual=true;return}
  if(f==='curName')S.curName=e.target.value;
  else if(f==='custom')S.customText=e.target.value;
  else if(S.edit)S.edit[f]=e.target.value;
});
document.addEventListener('change',async function(e){
  if(e.target.id==='backupFile'&&e.target.files&&e.target.files[0]){
    var bf=e.target.files[0];e.target.value='';
    try{
      var data=JSON.parse(await readFileText(bf));
      if(!data||data.app!=='garderoben'||!Array.isArray(data.items))throw new Error('format');
      S.importData=data;S.confirmDel=false;S.sheet='import';renderSheet(false);
    }catch(err){toast('Filen ser ikke ut som en sikkerhetskopi fra Garderoben')}
    return;
  }
  if(e.target.id!=='file'||!e.target.files||!e.target.files[0])return;
  try{S.edit.img=await fileToDataURL(e.target.files[0],800);S.edit.imgOrig='';S.edit.bg='orig';S.edit.seeds=[];S.edit.tapMode=false;S.edit.strokes=[];S.edit.paintMode=false;renderSheet(true)}
  catch(err){toast('Kunne ikke lese bildet. Prøv et JPEG- eller PNG-bilde.')}
});
/* freehand cream brush on the photo */
var painting=null;
function imgGeom(im){
  var r=im.getBoundingClientRect(),nw=im.naturalWidth,nh=im.naturalHeight;
  if(!nw||!nh||!r.width)return null;
  var sc=Math.min(r.width/nw,r.height/nh),dw=nw*sc,dh=nh*sc;
  return {rect:r,dw:dw,dh:dh,ox:r.left+(r.width-dw)/2,oy:r.top+(r.height-dh)/2};
}
function paintSeg(p,a,b){
  var x=p.ctx,g=p.g,R=p.r*g.dw;
  function X(u){return (g.ox-g.rect.left)+u*g.dw}
  function Y(v){return (g.oy-g.rect.top)+v*g.dh}
  x.fillStyle='#ede2c8';x.strokeStyle='#ede2c8';x.lineCap='round';x.lineJoin='round';x.lineWidth=2*R;
  x.beginPath();
  if(!b){x.arc(X(a[0]),Y(a[1]),R,0,Math.PI*2);x.fill()}
  else{x.moveTo(X(a[0]),Y(a[1]));x.lineTo(X(b[0]),Y(b[1]));x.stroke()}
}
document.addEventListener('pointerdown',function(ev){
  var e=S.edit;if(!e||!e.paintMode||painting)return;
  var im=ev.target;if(!im||im.tagName!=='IMG'||!im.closest||!im.closest('.photo'))return;
  var g=imgGeom(im);if(!g)return;
  var u=(ev.clientX-g.ox)/g.dw,v=(ev.clientY-g.oy)/g.dh;
  if(u<0||u>1||v<0||v>1)return;
  ev.preventDefault();
  try{im.setPointerCapture(ev.pointerId)}catch(err){}
  var cv=document.createElement('canvas');cv.className='paintcv';
  cv.width=Math.max(1,Math.round(g.rect.width));cv.height=Math.max(1,Math.round(g.rect.height));
  im.parentNode.appendChild(cv);
  painting={id:ev.pointerId,pts:[[+u.toFixed(4),+v.toFixed(4)]],r:(e.brush||6)/400,cv:cv,ctx:cv.getContext('2d'),g:g};
  paintSeg(painting,painting.pts[0],null);
});
document.addEventListener('pointermove',function(ev){
  var p=painting;if(!p||ev.pointerId!==p.id)return;
  ev.preventDefault();
  var g=p.g,u=Math.max(0,Math.min(1,(ev.clientX-g.ox)/g.dw)),v=Math.max(0,Math.min(1,(ev.clientY-g.oy)/g.dh)),last=p.pts[p.pts.length-1];
  if(Math.abs(u-last[0])+Math.abs(v-last[1])<0.003)return;
  var pt=[+u.toFixed(4),+v.toFixed(4)];p.pts.push(pt);paintSeg(p,last,pt);
});
async function endPaint(ev){
  var p=painting;if(!p||(ev&&ev.pointerId!==p.id))return;
  painting=null;
  var e=S.edit;
  if(!e){if(p.cv.parentNode)p.cv.parentNode.removeChild(p.cv);return}
  if(!e.imgOrig)e.imgOrig=e.img;
  e.strokes=(e.strokes||[]).concat([{r:p.r,pts:p.pts}]);
  await reprocessImg();
  if(p.cv.parentNode)p.cv.parentNode.removeChild(p.cv);
  if(S.edit===e)renderSheet(true);
}
document.addEventListener('pointerup',endPaint);
document.addEventListener('pointercancel',endPaint);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.sheet)H.closeSheet();
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.f==='custom'){e.preventDefault();H.addCustom()}
});

  var ok=await openDB();

      S.items=await dbAll('items');S.outfits=await dbAll('outfits');S.wish=await dbAll('wish');
      S.plans={};(await dbAll('plans')).forEach(function(pl){S.plans[pl.id]=pl});S.packs=await dbAll('packs');S.projects=await dbAll('projects');

      var lb=metaDocs.filter(function(m){return m.id==='lastBackup'})[0];S.lastBackup=lb?lb.at:'';
      S.items.forEach(function(i){i.tags=i.tags||[];i.seasons=i.seasons||[]});
      await migrate(metaDocs.filter(function(m){return m.id==='palette'})[0],metaDocs);
    }catch(e){S.storage=false;S.colors=DEFAULT_COLORS.map(function(c){return Object.assign({},c)})}
  }else{S.storage=false;S.colors=DEFAULT_COLORS.map(function(c){return Object.assign({},c)})}
  S.antMode=S.outfits.length?'vis':'bygg';
  render();
})();
})();
